  # CI workflows (agentreach_ci_workflow). fx-open and fx-attested carry the
  # pull_request_target pattern the claude-code-action security guide warns
  # about plus a run step with a blanket Bash rule; fx-hardened carries the
  # documented @claude workflow, pinned.
  - agentreach: CI-01
    control: ci_pr_head_not_checked_out
    fixtures:
      fx-open: [alarm]
      fx-attested: [alarm]
      fx-hardened: [ok]
      fx-managed: [ok]
    rows:
      fx-open: 2
      fx-hardened: 1
      fx-managed: 1
  - agentreach: CI-02
    control: ci_actor_check_kept
    fixtures:
      fx-open: [alarm]
      fx-attested: [alarm]
      fx-hardened: [ok]
      fx-managed: [ok]
    reasons:
      fx-open: "allowed_bots: '*' lets any bot or GitHub App start it"
  - agentreach: CI-03
    control: ci_shell_restricted
    fixtures:
      fx-open: [alarm]
      fx-attested: [alarm]
      fx-hardened: [ok]
      fx-managed: [ok]
    reasons:
      fx-open: "a blanket Bash allow rule"
  - agentreach: CI-04
    control: ci_actions_pinned
    fixtures:
      fx-open: [alarm]
      fx-attested: [alarm]
      fx-hardened: [ok]
      fx-managed: [ok]
    rows:
      fx-open: 1
      fx-managed: 1
  # Agent SDK launchers (agentreach_sdk_launcher): fx-open and fx-attested pass
  # bypassPermissions with no sandbox; fx-hardened passes dontAsk.
  - agentreach: AG-08
    control: sdk_launchers_not_bypassed
    fixtures:
      fx-open: [alarm]
      fx-attested: [alarm]
      fx-hardened: [ok]
      fx-managed: [ok]
    reasons:
      fx-hardened: "starts SDK sessions in dontAsk."

  # The managed_only_sql template's branches, on fx-managed (the only host
  # with an administrator): a key set in managed settings is ok, a key pasted
  # into a scope Claude Code ignores alarms, and a key absent under a managed
  # deployment alarms. Before fx-managed every managed-only control returned
  # skip everywhere and none of these branches ran in CI.
  - agentreach: HD-02
    control: managed_hooks_only
    fixtures:
      fx-open: [skip]
      fx-attested: [skip]
      fx-hardened: [skip]
      fx-bypassable: [skip]
      fx-auto: [skip]
      fx-review: [skip]
      fx-strict: [skip]
      fx-prompted: [skip]
      fx-services: [skip]
      fx-strict-services: [skip]
      fx-project: [skip]
      fx-keys: [skip]
      fx-managed: [ok]
      fx-codex: [skip]
      fx-flags: [skip]
      fx-unknown: [skip]
      fx-incomplete: [skip]
      fx-noprobe: [skip]
      fx-agents: [skip]
    reasons:
      fx-managed: "is set in managed settings"
  - agentreach: HD-11
    control: remote_settings_refresh_forced
    fixtures:
      fx-open: [skip]
      fx-attested: [skip]
      fx-hardened: [skip]
      fx-bypassable: [skip]
      fx-auto: [skip]
      fx-review: [skip]
      fx-strict: [skip]
      fx-prompted: [skip]
      fx-services: [skip]
      fx-strict-services: [skip]
      fx-project: [skip]
      fx-keys: [skip]
      fx-managed: [alarm]
      fx-codex: [skip]
      fx-flags: [skip]
      fx-unknown: [skip]
      fx-incomplete: [skip]
      fx-noprobe: [skip]
      fx-agents: [skip]
    reasons:
      fx-managed: "is set in user settings, where Claude Code ignores it"
  - agentreach: HD-01
    control: managed_permission_rules_only
    vars:
      deployment: teams
    fixtures:
      fx-open: [alarm]
      fx-attested: [alarm]
      fx-hardened: [alarm]
      fx-bypassable: [alarm]
      fx-auto: [alarm]
      fx-review: [alarm]
      fx-strict: [alarm]
      fx-prompted: [alarm]
      fx-services: [alarm]
      fx-strict-services: [alarm]
      fx-project: [alarm]
      fx-keys: [alarm]
      fx-managed: [alarm]
      fx-codex: [alarm]
      fx-flags: [alarm]
      fx-unknown: [alarm]
      fx-incomplete: [alarm]
      fx-noprobe: [alarm]
      fx-agents: [alarm]
    reasons:
      fx-managed: "is not set in managed settings"
