    fixtures:
      fx-auto: [alarm]
      fx-bypassable: [alarm]
      fx-hardened: [alarm]
      fx-incomplete: [alarm]
      fx-keys: [alarm]
      fx-noprobe: [alarm]
      fx-open: [alarm]
      fx-attested: [alarm]
      fx-project: [alarm]
      fx-prompted: [alarm]
      fx-review: [alarm]
      fx-services: [alarm]
      fx-strict: [alarm]
      fx-strict-services: [alarm]
      fx-unknown: [alarm]
      fx-codex: [alarm]
      fx-flags: [alarm]
