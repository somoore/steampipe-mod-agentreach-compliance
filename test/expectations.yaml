  # M15: crossSessionInbound refuse in a project file applies in that project only.
  - agentreach: HD-58
    control: cross_session_inbound_refused
    fixtures:
      fx-auto: [info]
      fx-bypassable: [info]
      fx-hardened: [info]
      fx-incomplete: [info]
      fx-keys: [info]
      fx-noprobe: [info]
      fx-open: [info]
      fx-attested: [info]
      fx-project: [info]
      fx-prompted: [info]
      fx-review: [info]
